<article class="post">
  <header>
    <h1>{{title}}</h1>
    <p class="meta"><time datetime="{{isodate}}">{{date}}</time></p>
  </header>
  <div class="post-body">
{{body}}
  </div>
  <footer>
    <p class="respond">Comments are long gone, but you can <a href="mailto:robashton@codeofrob.com">email me</a> if you've got something to say.</p>
    {{comments}}
    <nav class="older-newer">{{nav}}</nav>
  </footer>
</article>
